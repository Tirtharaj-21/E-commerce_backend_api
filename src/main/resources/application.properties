spring.application.name=shopper

# ---- Datasource (MySQL) ----
spring.datasource.url=jdbc:mysql://localhost:3306/shopper_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ---- JWT ----
# 256-bit+ secret used to sign tokens. Override this via an environment variable in real deployments.
app.jwt.secret=${JWT_SECRET:c29tZS1yZWFsbHktbG9uZy1hbmQtc2VjdXJlLXNlY3JldC1rZXktZm9yLXNob3BwZXItand0LXRva2Vucy0yMDI2}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
